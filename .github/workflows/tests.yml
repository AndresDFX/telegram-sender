name: tests

# Pipeline de PRUEBAS UNITARIAS dedicado: corre en CADA push (cualquier rama) y en cada PR a main,
# independiente del despliegue (deploy.yml). Si algo falla (tests, sintaxis Python/JS del panel o del
# servicio Node), el job queda en ROJO y bloquea el merge del PR.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/lambda/requirements.txt
      # Los módulos importan requests/boto3/telethon al cargarse; sin deps, los tests no importan.
      - name: Instalar dependencias
        run: pip install -r src/lambda/requirements.txt

      - name: Pruebas unitarias (Python)
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validar sintaxis del servicio WhatsApp (Node)
        run: node --check whatsapp-service/src/index.js

      # El panel admin es un string _PAGE con JS embebido: se extrae y se valida con node --check
      # para cazar errores de sintaxis que los tests de Python no detectan.
      - name: Validar JS del panel admin
        run: |
          python - <<'PY'
          import re
          s = open('src/lambda/entrypoints/admin.py', encoding='utf-8').read()
          a = s.index('_PAGE = r"""') + len('_PAGE = r"""')
          page = s[a:s.index('"""', a)]
          scripts = re.findall(r'<script>(.*?)</script>', page, re.S)
          open('panel_extracted.js', 'w', encoding='utf-8').write('\n;\n'.join(scripts))
          print(f'extraídos {len(scripts)} bloque(s) <script>')
          PY
          node --check panel_extracted.js

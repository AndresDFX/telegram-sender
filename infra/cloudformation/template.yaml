AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Telegram → Telegram sync: API Gateway webhook, Lambda receptor, cola SQS + DLQ,
  Lambda worker (broadcaster) y DynamoDB de suscriptores.

Parameters:
  ProjectName:
    Type: String
    Default: telegram-sync
    Description: Prefijo para nombrar recursos.

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Entorno de despliegue.

  TelegramBotToken:
    Type: String
    NoEcho: true
    Description: Token del bot de Telegram (formato 123456:ABC...).

  WebhookSecretToken:
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 256
    AllowedPattern: "^[A-Za-z0-9_-]+$"
    ConstraintDescription: 16-256 caracteres [A-Za-z0-9_-]. Es obligatorio (fail-closed).
    Description: >
      Secreto compartido con setWebhook. Telegram lo reenvía en el header
      X-Telegram-Bot-Api-Secret-Token y el receptor lo valida en tiempo constante.
      Obligatorio: el endpoint está expuesto y sin él se rechaza toda petición.

  AdminUser:
    Type: String
    Default: admin
    Description: Usuario de la interfaz web de administración (Basic Auth).

  AdminPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 128
    ConstraintDescription: 8-128 caracteres. Obligatorio (la GUI es fail-closed).
    Description: Contraseña de la interfaz web (Basic Auth). Sin ella, el panel rechaza todo.

  SourceChannelId:
    Type: String
    Default: ""
    Description: >
      ID del canal fuente (-100...). Vacío acepta cualquier channel_post; en prod,
      fíjalo para que solo tu canal pueda disparar broadcasts (autorización de contenido).

  SendMode:
    Type: String
    Default: bot
    AllowedValues:
      - bot
      - userbot
    Description: >
      bot = envía como bot a los suscriptores (/start); userbot = envía como TU cuenta
      (Telethon) a tus contactos. userbot requiere TelethonApiId/Hash/Session.

  TelethonApiId:
    Type: String
    Default: ""
    Description: API ID de my.telegram.org (solo modo userbot).

  TelethonApiHash:
    Type: String
    NoEcho: true
    Default: ""
    Description: API Hash de my.telegram.org (solo modo userbot).

  TelethonSession:
    Type: String
    NoEcho: true
    Default: ""
    Description: StringSession generado con scripts/generar_sesion.py (solo modo userbot; acceso total a tu cuenta).

  SourceChannelUsername:
    Type: String
    Default: iproparts
    Description: >
      Username del canal PÚBLICO a sondear (sin @). El poller lee https://t.me/s/<username>.

  PollerScheduleExpression:
    Type: String
    Default: rate(5 minutes)
    Description: Frecuencia del poller (EventBridge), p.ej. rate(5 minutes) o rate(1 minute).

  DedupTtlSeconds:
    Type: Number
    Default: 86400
    MinValue: 300
    MaxValue: 604800
    Description: Horizonte de deduplicación de update_id (TTL del registro). Default 24h.

  MarkupPercentage:
    Type: Number
    Default: 15
    MinValue: 0
    MaxValue: 100
    Description: Porcentaje de markup aplicado a precios detectados.

  SendDelaySeconds:
    Type: Number
    Default: 0.05
    MinValue: 0.01
    MaxValue: 1
    Description: Retraso entre envíos para respetar límites de Telegram.

  BroadcastBatchSize:
    Type: Number
    Default: 150
    MinValue: 1
    MaxValue: 500
    Description: >
      Tamaño de lote por defecto (contactos por lote). Editable desde el panel con tope 150.
      Es el valor inicial; la config en runtime (DynamoDB) lo sobreescribe.

  DispatcherScheduleExpression:
    Type: String
    Default: rate(1 minute)
    Description: >
      Frecuencia del dispatcher (EventBridge). Libera como mucho UN lote por tick, de forma
      secuencial y dentro de la ventana horaria configurada. rate(1 minute) es lo recomendado.

  DispatcherReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 10
    Description: >
      Concurrencia reservada del dispatcher. 0 = sin reservar (recomendado en cuentas con
      límite de concurrencia bajo). La secuencialidad NO depende de esto: el gate in_flight +
      liberar un lote por tick ya garantiza un lote a la vez.

  ReceiverTimeoutSeconds:
    Type: Number
    Default: 30
    MinValue: 10
    MaxValue: 60
    Description: Timeout del receptor (solo parsea, consulta y encola; responde rápido).

  WorkerTimeoutSeconds:
    Type: Number
    Default: 120
    MinValue: 30
    MaxValue: 300
    Description: Timeout del worker por lote. La VisibilityTimeout de la cola debe superarlo.

  WorkerReservedConcurrency:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 100
    Description: >
      Concurrencia reservada del worker (=1 serializa los envíos y respeta los 30 msg/s
      de Telegram). Usa 0 para NO reservar en cuentas con límite de concurrencia bajo
      (p.ej. cuentas nuevas con límite 10, donde reservar deja <10 sin reservar y AWS lo
      rechaza); en ese caso controla el ritmo con SEND_DELAY_SECONDS y/o eleva el límite.

  LambdaMemorySize:
    Type: Number
    Default: 256
    AllowedValues:
      - 128
      - 256
      - 512
    Description: Memoria asignada a las Lambdas.

  LambdaCodeS3Bucket:
    Type: String
    Description: Bucket S3 con el artefacto zip de la Lambda.

  LambdaCodeS3Key:
    Type: String
    Default: lambda/telegram-broadcaster.zip
    Description: Key del zip de la Lambda en S3.

  AlertEmail:
    Type: String
    Default: ""
    Description: >
      Email para recibir alarmas (DLQ no vacía, errores de Lambda). Vacío = no se suscribe nadie
      (las alarmas y el tópico SNS se crean igual; puedes suscribir un endpoint luego).

Conditions:
  # Solo aplica concurrencia reservada al worker si es > 0 (ver WorkerReservedConcurrency).
  HasWorkerReservedConcurrency: !Not [!Equals [!Ref WorkerReservedConcurrency, 0]]
  HasDispatcherReservedConcurrency: !Not [!Equals [!Ref DispatcherReservedConcurrency, 0]]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  SubscribersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-subscribers"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: chatId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: chatId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # Dedup de update_id: PutItem condicional + TTL para no crecer indefinidamente.
  ProcessedUpdatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-processed-updates"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: updateId
          AttributeType: S
      KeySchema:
        - AttributeName: updateId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # Config editable en runtime (canal, markup, símbolos, ubicación, whatsapp, imagen).
  ConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-config"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: configId
          AttributeType: S
      KeySchema:
        - AttributeName: configId
          KeyType: HASH
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # Sesión de WhatsApp (Baileys) persistida por el servicio externo (Render/Fly/...).
  WhatsAppAuthTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-whatsapp-auth"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # Estados de los envíos (jobs): progreso por canal + TTL para auto-expirar el historial.
  BroadcastsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-broadcasts"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # Planes de envío FRACCIONADO: clave compuesta (pid + sk). sk="PLAN" guarda metadatos y
  # cursores; sk="TG#000007" guarda los ids de cada lote de Telegram. TTL para auto-limpiar.
  PlansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-plans"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: pid
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pid
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # Bitácora de acciones del panel (auditoría) con TTL.
  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-audit"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # Mensajes programados (once/daily/weekly). El dispatcher los materializa al vencer.
  SchedulesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-schedules"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: sid
          AttributeType: S
      KeySchema:
        - AttributeName: sid
          KeyType: HASH
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # --- Cola de broadcast + DLQ -------------------------------------------------
  BroadcastDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${EnvironmentName}-broadcast-dlq"
      MessageRetentionPeriod: 1209600 # 14 días
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  BroadcastQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${EnvironmentName}-broadcast"
      # VisibilityTimeout > timeout del worker para no reentregar lotes en vuelo.
      VisibilityTimeout: !Ref WorkerTimeoutSeconds
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BroadcastDLQ.Arn
        maxReceiveCount: 5
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # --- Monitoreo: SNS + alarmas CloudWatch ------------------------------------
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-${EnvironmentName}-alerts"

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # DLQ con mensajes = envíos fallidos sin procesar -> avisar.
  DlqNotEmptyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${EnvironmentName}-dlq-no-vacia"
      AlarmDescription: Hay mensajes en la DLQ de broadcast (lotes que agotaron reintentos).
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt BroadcastDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  WorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${EnvironmentName}-worker-errores"
      AlarmDescription: El worker (envío Telegram) está registrando errores.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  DispatcherErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${EnvironmentName}-dispatcher-errores"
      AlarmDescription: El dispatcher (liberación de lotes) está fallando.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DispatcherFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  PollerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${EnvironmentName}-poller-errores"
      AlarmDescription: El poller (ingesta del canal) está fallando.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PollerFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  # --- IAM: receptor (parsea + consulta + encola) ------------------------------
  ReceiverExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-receiver-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReceiverAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:UpdateItem # registrar_suscriptor (/start, /stop)
                Resource:
                  - !GetAtt SubscribersTable.Arn
                  - !Sub "${SubscribersTable.Arn}/index/*"
              - Effect: Allow
                Action:
                  - dynamodb:PutItem # dedup de update_id
                  - dynamodb:DeleteItem # compensación del dedup
                Resource:
                  - !GetAtt ProcessedUpdatesTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem # leer config (canal/markup/footer/imagen)
                Resource:
                  - !GetAtt ConfigTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem # crear el job del envío (estado)
                Resource:
                  - !GetAtt BroadcastsTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem # crear plan fraccionado (channel_post por webhook)
                  - dynamodb:BatchWriteItem # lotes del plan
                Resource:
                  - !GetAtt PlansTable.Arn
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - !GetAtt BroadcastQueue.Arn

  # --- IAM: worker (envía + marca inactivos + consume cola) --------------------
  WorkerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-worker-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: WorkerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt SubscribersTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem # leer config en runtime (modo de envío, credenciales, delays)
                  - dynamodb:UpdateItem # auto-pausa anti-baneo (sending_enabled / ban_strikes)
                Resource:
                  - !GetAtt ConfigTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem # progreso del job (estado del envío)
                Resource:
                  - !GetAtt BroadcastsTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem # ¿el plan fue cancelado? -> descartar lote en vuelo
                Resource:
                  - !GetAtt PlansTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem # idempotencia: ¿lote ya entregado?
                  - dynamodb:PutItem # marcar lote entregado
                Resource:
                  - !GetAtt ProcessedUpdatesTable.Arn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  - !GetAtt BroadcastQueue.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject # firmar URL temporal de la imagen para enviarla
                Resource:
                  - !Sub "arn:aws:s3:::${LambdaCodeS3Bucket}/images/*"

  # --- Lambda receptor (webhook) ----------------------------------------------
  ReceiverFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${EnvironmentName}-receiver"
      Description: Parsea webhooks de Telegram, aplica markup y encola lotes en SQS.
      Runtime: python3.12
      Handler: entrypoints.receiver.lambda_handler
      Role: !GetAtt ReceiverExecutionRole.Arn
      Timeout: !Ref ReceiverTimeoutSeconds
      MemorySize: !Ref LambdaMemorySize
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          SUBSCRIBERS_TABLE: !Ref SubscribersTable
          SUBSCRIBERS_STATUS_INDEX: StatusIndex
          PROCESSED_UPDATES_TABLE: !Ref ProcessedUpdatesTable
          CONFIG_TABLE: !Ref ConfigTable
          DEDUP_TTL_SECONDS: !Ref DedupTtlSeconds
          SOURCE_CHANNEL_ID: !Ref SourceChannelId
          MARKUP_PERCENTAGE: !Ref MarkupPercentage
          BROADCAST_QUEUE_URL: !Ref BroadcastQueue
          BROADCAST_BATCH_SIZE: !Ref BroadcastBatchSize
          BROADCASTS_TABLE: !Ref BroadcastsTable
          PLANS_TABLE: !Ref PlansTable
          # Token para responder a /start y /stop (el broadcast lo hace el worker).
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          WEBHOOK_SECRET_TOKEN: !Ref WebhookSecretToken
          # Nota: ALLOW_INSECURE_WEBHOOK NO se define aquí → el endpoint es fail-closed.
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # --- Lambda worker (broadcaster) --------------------------------------------
  # ReservedConcurrentExecutions: 1 → un solo lote a la vez. Junto con
  # SEND_DELAY_SECONDS mantiene el ritmo global bajo el límite de 30 msg/s.
  WorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${EnvironmentName}-worker"
      Description: Consume lotes de SQS y distribuye por DM con manejo de 403/429.
      Runtime: python3.12
      Handler: entrypoints.worker.lambda_handler
      Role: !GetAtt WorkerExecutionRole.Arn
      Timeout: !Ref WorkerTimeoutSeconds
      MemorySize: !Ref LambdaMemorySize
      ReservedConcurrentExecutions:
        !If [HasWorkerReservedConcurrency, !Ref WorkerReservedConcurrency, !Ref "AWS::NoValue"]
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          # El worker solo envía y marca inactivos (update_item en la tabla base);
          # no consulta el GSI, por eso no necesita SUBSCRIBERS_STATUS_INDEX.
          SUBSCRIBERS_TABLE: !Ref SubscribersTable
          # CONFIG_TABLE es OBLIGATORIO: build_deliver_batch() lee la config en runtime
          # (modo de envío, credenciales userbot, delays). Sin él, DynamoDbConfigStore caía
          # al nombre por defecto "Config" -> AccessDenied -> el worker fallaba en _ensure y
          # NINGÚN envío de Telegram se entregaba (fallo silencioso -> DLQ, sin marcar fallido).
          CONFIG_TABLE: !Ref ConfigTable
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          SEND_DELAY_SECONDS: !Ref SendDelaySeconds
          IMAGES_BUCKET: !Ref LambdaCodeS3Bucket
          BROADCASTS_TABLE: !Ref BroadcastsTable
          SEND_MODE: !Ref SendMode
          TELETHON_API_ID: !Ref TelethonApiId
          TELETHON_API_HASH: !Ref TelethonApiHash
          TELETHON_SESSION: !Ref TelethonSession
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  WorkerEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt BroadcastQueue.Arn
      FunctionName: !Ref WorkerFunction
      BatchSize: 1
      FunctionResponseTypes:
        - ReportBatchItemFailures

  # --- Poller del canal público (ingesta opción C) ----------------------------
  PollerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-poller-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PollerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query # suscriptores activos (GSI)
                Resource:
                  - !GetAtt SubscribersTable.Arn
                  - !Sub "${SubscribersTable.Arn}/index/*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem # leer high-water mark
                  - dynamodb:PutItem # guardar high-water mark
                Resource:
                  - !GetAtt ProcessedUpdatesTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem # leer config (canal/markup/footer/imagen)
                  - dynamodb:PutItem # escribir caché de contactos (userbot)
                Resource:
                  - !GetAtt ConfigTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem # crear el job del envío (estado)
                Resource:
                  - !GetAtt BroadcastsTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem # crear plan fraccionado
                  - dynamodb:BatchWriteItem # lotes del plan
                Resource:
                  - !GetAtt PlansTable.Arn
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - !GetAtt BroadcastQueue.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject # firmar URL temporal de la imagen para WhatsApp
                Resource:
                  - !Sub "arn:aws:s3:::${LambdaCodeS3Bucket}/images/*"

  PollerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${EnvironmentName}-poller"
      Description: Sondea el canal público (t.me/s), detecta posts nuevos, aplica markup y encola.
      Runtime: python3.12
      Handler: entrypoints.poller.lambda_handler
      Role: !GetAtt PollerExecutionRole.Arn
      Timeout: 60
      MemorySize: !Ref LambdaMemorySize
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          SOURCE_CHANNEL_USERNAME: !Ref SourceChannelUsername
          SUBSCRIBERS_TABLE: !Ref SubscribersTable
          SUBSCRIBERS_STATUS_INDEX: StatusIndex
          PROCESSED_UPDATES_TABLE: !Ref ProcessedUpdatesTable
          CONFIG_TABLE: !Ref ConfigTable
          BROADCAST_QUEUE_URL: !Ref BroadcastQueue
          BROADCAST_BATCH_SIZE: !Ref BroadcastBatchSize
          BROADCASTS_TABLE: !Ref BroadcastsTable
          PLANS_TABLE: !Ref PlansTable
          MARKUP_PERCENTAGE: !Ref MarkupPercentage
          SEND_MODE: !Ref SendMode
          TELETHON_API_ID: !Ref TelethonApiId
          TELETHON_API_HASH: !Ref TelethonApiHash
          TELETHON_SESSION: !Ref TelethonSession
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  PollerSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-poller-schedule"
      Description: Dispara el poller del canal público periódicamente.
      ScheduleExpression: !Ref PollerScheduleExpression
      State: ENABLED
      Targets:
        - Id: PollerTarget
          Arn: !GetAtt PollerFunction.Arn

  PollerSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PollerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PollerSchedule.Arn

  # --- Dispatcher: envío fraccionado/secuencial (un lote por tick) ------------
  DispatcherExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-dispatcher-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DispatcherAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem # leer config (ventana, jitter, batch_size)
                Resource:
                  - !GetAtt ConfigTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:Scan # planes activos
                  - dynamodb:GetItem # ids de cada lote / metadatos
                  - dynamodb:UpdateItem # avanzar cursor, in_flight, bitácora
                  - dynamodb:PutItem # crear plan al materializar un mensaje programado
                  - dynamodb:BatchWriteItem # lotes del plan (PlanStore.crear usa batch_writer)
                Resource:
                  - !GetAtt PlansTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem # leer progreso del job (¿terminó el lote?)
                  - dynamodb:PutItem # crear job al materializar un mensaje programado
                Resource:
                  - !GetAtt BroadcastsTable.Arn
              - Effect: Allow
                Action:
                  - sqs:SendMessage # liberar UN lote de Telegram a la cola
                Resource:
                  - !GetAtt BroadcastQueue.Arn
              - Effect: Allow
                Action:
                  - dynamodb:Scan # mensajes programados vencidos
                  - dynamodb:UpdateItem # avanzar next_run / desactivar tras disparar
                Resource:
                  - !GetAtt SchedulesTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:Scan # destinatarios (modo bot) al materializar
                  - dynamodb:Query
                Resource:
                  - !GetAtt SubscribersTable.Arn
                  - !Sub "${SubscribersTable.Arn}/index/*"

  DispatcherFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${EnvironmentName}-dispatcher"
      Description: Libera un lote por tick (secuencial, dentro de ventana) del plan activo más antiguo.
      Runtime: python3.12
      Handler: entrypoints.dispatcher.lambda_handler
      Role: !GetAtt DispatcherExecutionRole.Arn
      Timeout: 60
      MemorySize: !Ref LambdaMemorySize
      ReservedConcurrentExecutions:
        !If [HasDispatcherReservedConcurrency, !Ref DispatcherReservedConcurrency, !Ref "AWS::NoValue"]
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          CONFIG_TABLE: !Ref ConfigTable
          PLANS_TABLE: !Ref PlansTable
          BROADCASTS_TABLE: !Ref BroadcastsTable
          BROADCAST_QUEUE_URL: !Ref BroadcastQueue
          SEND_MODE: !Ref SendMode
          SCHEDULES_TABLE: !Ref SchedulesTable
          SUBSCRIBERS_TABLE: !Ref SubscribersTable
          SUBSCRIBERS_STATUS_INDEX: StatusIndex
          IMAGES_BUCKET: !Ref LambdaCodeS3Bucket
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  DispatcherSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-dispatcher-schedule"
      Description: Dispara el dispatcher para gotear lotes de forma fraccionada/secuencial.
      ScheduleExpression: !Ref DispatcherScheduleExpression
      State: ENABLED
      Targets:
        - Id: DispatcherTarget
          Arn: !GetAtt DispatcherFunction.Arn

  DispatcherSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DispatcherFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DispatcherSchedule.Arn

  # --- Interfaz web de administración -----------------------------------------
  AdminExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-admin-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AdminAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem # leer config
                  - dynamodb:UpdateItem # guardar config
                  - dynamodb:PutItem # sesión temporal del login userbot
                  - dynamodb:DeleteItem # limpiar la sesión temporal tras conectar
                Resource:
                  - !GetAtt ConfigTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:Scan # listar suscriptores
                  - dynamodb:UpdateItem # activar/desactivar
                Resource:
                  - !GetAtt SubscribersTable.Arn
              - Effect: Allow
                Action:
                  - sqs:GetQueueAttributes # profundidad de cola/DLQ
                  - sqs:SendMessage # encolar envío manual
                  - sqs:ReceiveMessage # inspeccionar muestra de la DLQ en el panel
                  - sqs:StartMessageMoveTask # redrive de la DLQ a la cola
                  - sqs:PurgeQueue # descartar la DLQ
                Resource:
                  - !GetAtt BroadcastQueue.Arn
                  - !GetAtt BroadcastDLQ.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem # crear job de envío manual
                  - dynamodb:Scan # listar envíos (estados)
                Resource:
                  - !GetAtt BroadcastsTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem # crear plan fraccionado (envío manual)
                  - dynamodb:BatchWriteItem # lotes del plan
                  - dynamodb:Scan # vista de programación / monitoreo
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem # cancelar difusiones pendientes
                Resource:
                  - !GetAtt PlansTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem # registrar acción en auditoría
                  - dynamodb:Scan # listar auditoría
                Resource:
                  - !GetAtt AuditTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem # crear mensaje programado
                  - dynamodb:Scan # listar mensajes programados
                  - dynamodb:UpdateItem # activar/pausar
                  - dynamodb:DeleteItem # borrar
                Resource:
                  - !GetAtt SchedulesTable.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject # subir la imagen de la lista
                  - s3:GetObject # firmar URL temporal (adjuntar imagen en envío manual)
                Resource:
                  - !Sub "arn:aws:s3:::${LambdaCodeS3Bucket}/images/*"

  AdminFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${EnvironmentName}-admin"
      Description: Interfaz web de administración (config, cola, suscriptores) con Basic Auth.
      Runtime: python3.12
      Handler: entrypoints.admin.lambda_handler
      Role: !GetAtt AdminExecutionRole.Arn
      Timeout: 30
      MemorySize: !Ref LambdaMemorySize
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          CONFIG_TABLE: !Ref ConfigTable
          SUBSCRIBERS_TABLE: !Ref SubscribersTable
          SUBSCRIBERS_STATUS_INDEX: StatusIndex
          BROADCAST_QUEUE_URL: !Ref BroadcastQueue
          BROADCAST_DLQ_URL: !Ref BroadcastDLQ
          BROADCASTS_TABLE: !Ref BroadcastsTable
          PLANS_TABLE: !Ref PlansTable
          AUDIT_TABLE: !Ref AuditTable
          SCHEDULES_TABLE: !Ref SchedulesTable
          BROADCAST_BATCH_SIZE: !Ref BroadcastBatchSize
          IMAGES_BUCKET: !Ref LambdaCodeS3Bucket
          ADMIN_USER: !Ref AdminUser
          ADMIN_PASSWORD: !Ref AdminPassword
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          WEBHOOK_SECRET_TOKEN: !Ref WebhookSecretToken
          WEBHOOK_URL: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/webhook/telegram"
          SEND_MODE: !Ref SendMode
          TELETHON_API_ID: !Ref TelethonApiId
          TELETHON_API_HASH: !Ref TelethonApiHash
          TELETHON_SESSION: !Ref TelethonSession
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # --- API Gateway HTTP -------------------------------------------------------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-webhook-api"
      ProtocolType: HTTP
      Description: Webhook público para actualizaciones de Telegram.

  WebhookIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ReceiverFunction.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  WebhookRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /webhook/telegram"
      Target: !Sub "integrations/${WebhookIntegration}"

  AdminIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminFunction.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  AdminRoot:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /admin"
      Target: !Sub "integrations/${AdminIntegration}"

  AdminProxy:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "ANY /admin/{proxy+}"
      Target: !Sub "integrations/${AdminIntegration}"

  AdminInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AdminFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: !Ref EnvironmentName
      AutoDeploy: true
      # Throttling a nivel de API (independiente del contenedor) como freno de fuerza bruta
      # distribuida contra /admin y de abuso del webhook. Holgado para el uso normal (bajo tráfico).
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ReceiverFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

Outputs:
  WebhookUrl:
    Description: URL para registrar en setWebhook de Telegram.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/webhook/telegram"

  AdminUrl:
    Description: URL de la interfaz web de administración (Basic Auth).
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/admin"

  SubscribersTableName:
    Description: Tabla DynamoDB de suscriptores.
    Value: !Ref SubscribersTable

  ProcessedUpdatesTableName:
    Description: Tabla DynamoDB de deduplicación de updates.
    Value: !Ref ProcessedUpdatesTable

  ReceiverFunctionName:
    Description: Nombre de la función Lambda receptora.
    Value: !Ref ReceiverFunction

  WorkerFunctionName:
    Description: Nombre de la función Lambda worker.
    Value: !Ref WorkerFunction

  PollerFunctionName:
    Description: Nombre de la función Lambda poller (canal público).
    Value: !Ref PollerFunction

  DispatcherFunctionName:
    Description: Nombre de la función Lambda dispatcher (envío fraccionado/secuencial).
    Value: !Ref DispatcherFunction

  PlansTableName:
    Description: Tabla DynamoDB de planes de envío fraccionado.
    Value: !Ref PlansTable

  BroadcastQueueUrl:
    Description: URL de la cola SQS de broadcast.
    Value: !Ref BroadcastQueue

  BroadcastDLQUrl:
    Description: URL de la dead-letter queue.
    Value: !Ref BroadcastDLQ

  HttpApiId:
    Description: ID del HTTP API Gateway.
    Value: !Ref HttpApi

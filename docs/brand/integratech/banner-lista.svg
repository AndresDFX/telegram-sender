<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540" role="img" aria-label="IntegraTech - Lista de Precios. Actualizada al dia.">
  <defs>
    <!-- Fondo de marca: azul integracion -> azul profundo -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D4FD0"/>
      <stop offset="0.55" stop-color="#1A40A8"/>
      <stop offset="1" stop-color="#18305F"/>
    </linearGradient>
    <!-- Acento cian/teal para el detalle de conexion -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22CCEE"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFF9FE"/>
    </linearGradient>
    <!-- Brillo radial sutil arriba a la derecha -->
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#22CCEE" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#22CCEE" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#22CCEE" stop-opacity="0"/>
    </radialGradient>
    <!-- Sombra suave para tarjetas/pildoras -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0A0F1C" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- ===== Fondo ===== -->
  <rect width="1080" height="540" fill="url(#bgGrad)"/>
  <rect width="1080" height="540" fill="url(#glow)"/>

  <!-- Patron tenue de "integracion": nodos conectados (decorativo) -->
  <g stroke="#608AFA" stroke-opacity="0.22" stroke-width="2" fill="none">
    <path d="M880 70 L980 130 L900 220 L1010 270"/>
    <path d="M980 130 L1040 90"/>
  </g>
  <g fill="#67E2F9" fill-opacity="0.55">
    <circle cx="880" cy="70" r="5"/>
    <circle cx="980" cy="130" r="6"/>
    <circle cx="900" cy="220" r="5"/>
    <circle cx="1010" cy="270" r="5"/>
    <circle cx="1040" cy="90" r="4"/>
  </g>

  <!-- Barra de acento lateral -->
  <rect x="0" y="0" width="14" height="540" fill="url(#accentGrad)"/>

  <!-- ===== Logo / Wordmark IntegraTech ===== -->
  <g transform="translate(72,66)">
    <!-- Marca grafica: dos modulos que se integran -->
    <g filter="url(#soft)">
      <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#accentGrad)"/>
      <path d="M14 24 h20 M24 14 v20" stroke="#06222B" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- Wordmark -->
    <text x="64" y="22" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="26" font-weight="700" letter-spacing="0.2"
          fill="#FFFFFF">Integra<tspan fill="#67E2F9">Tech</tspan></text>
    <text x="64" y="44" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="13" font-weight="500" letter-spacing="3" fill="#93B4FD">INTEGRACION &#183; TECNOLOGIA</text>
  </g>

  <!-- ===== Bloque central ===== -->
  <g transform="translate(72,196)">
    <!-- Pildora etiqueta -->
    <g filter="url(#soft)">
      <rect x="0" y="0" width="232" height="40" rx="20" fill="#06B6D4"/>
    </g>
    <text x="116" y="26" text-anchor="middle"
          font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="15" font-weight="700" letter-spacing="2" fill="#06222B">DOCUMENTO COMERCIAL</text>

    <!-- Titulo grande -->
    <text x="0" y="120" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="92" font-weight="700" letter-spacing="-1.5"
          fill="url(#titleGrad)">LISTA DE</text>
    <text x="0" y="210" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="92" font-weight="700" letter-spacing="-1.5"
          fill="url(#titleGrad)">PRECIOS</text>

    <!-- Subrayado de acento -->
    <rect x="4" y="232" width="300" height="6" rx="3" fill="url(#accentGrad)"/>

    <!-- Subtitulo -->
    <text x="0" y="278" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="24" font-weight="500" fill="#DBE6FE">Actualizada al dia &#183; Precios vigentes</text>
  </g>

  <!-- ===== Pie discreto ===== -->
  <line x1="72" y1="486" x2="1008" y2="486" stroke="#608AFA" stroke-opacity="0.30" stroke-width="1.5"/>
  <text x="72" y="514" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="15" font-weight="500" fill="#93B4FD">IntegraTech &#8212; Soluciones de integracion</text>
  <text x="1008" y="514" text-anchor="end"
        font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="15" font-weight="500" fill="#93B4FD">Documento informativo &#183; sujeto a cambios</text>
</svg>

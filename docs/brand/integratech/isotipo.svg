<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="IntegraTech isotipo">
  <defs>
    <linearGradient id="itFlowMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- Fondo opcional cuadrado redondeado (favicon/avatar) -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#EFF4FF"/>
  <!-- Flujo de integracion entre nodos -->
  <path d="M22 22 C22 38 42 26 42 42" fill="none" stroke="url(#itFlowMark)" stroke-width="8" stroke-linecap="round"/>
  <!-- Nodo superior (primario) -->
  <circle cx="22" cy="22" r="12" fill="#2563EB"/>
  <circle cx="22" cy="22" r="5" fill="#EFF4FF"/>
  <!-- Nodo inferior (secundario / dato) -->
  <circle cx="42" cy="42" r="12" fill="#06B6D4"/>
  <circle cx="42" cy="42" r="5" fill="#ECFDFF"/>
</svg>
